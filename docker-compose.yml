services:
  app:
    build:
      context: ./gymtracker
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/gymtracker
      DB_USERNAME: gymtracker_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_REGISTRATION_CODE: ${APP_REGISTRATION_CODE:?Set APP_REGISTRATION_CODE in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8081"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gymtracker
      MYSQL_USER: gymtracker_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - gymtracker-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    profiles: ["server"]
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  tunnel:
    profiles: ["quick-tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8081"]
    depends_on:
      - app

volumes:
  gymtracker-db:
  caddy-data:
  caddy-config:
