services:
  app:
    build:
      context: ./gymtracker
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/gymtracker
      DB_USERNAME: gymtracker_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_REGISTRATION_CODE: ${APP_REGISTRATION_CODE:?Set APP_REGISTRATION_CODE in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-375237205720-ans37v58om7rjo8qh93t76st4igt4k30.apps.googleusercontent.com}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8081"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymtracker
      POSTGRES_USER: gymtracker_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - gymtracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymtracker_app -d gymtracker"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    profiles: ["server"]
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  tunnel:
    profiles: ["quick-tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8081"]
    depends_on:
      - app

volumes:
  gymtracker-postgres-data:
  caddy-data:
  caddy-config:
