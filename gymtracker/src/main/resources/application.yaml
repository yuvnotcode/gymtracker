spring:
  application:
    name: gymtracker

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gymtracker}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  security:
    jwt-secret: ${JWT_SECRET}
