spring:
  application:
    name: gymtracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymtracker}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8081}

app:
  security:
    jwt-secret: ${JWT_SECRET}
  registration-code: ${APP_REGISTRATION_CODE:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
